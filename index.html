<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CREFITO-8 em Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: palco fixo 1920×1080 (TV) escalado para a tela; telas geradas de DADOS, trocando sozinhas.
   Modelo do painel público: publico.py troca o marcador de dados pelas telas do ano (só totais). */
:root{
  --fundo:#0d1a2b; --painel:#13253b; --linha:#22395a; --tinta:#f2f5f9; --suave:#9db0c8;
  --ambar:#f2b544; --ceu:#5fb3e8; --bom:#4fc98a;
  --titulo:"Archivo","Arial Narrow",system-ui,sans-serif; --texto:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dur:12s; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fundo);color:var(--tinta);font-family:var(--texto);overflow:hidden}
.palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));
  background:radial-gradient(1200px 700px at 85% 10%,#16304f 0,transparent 70%),var(--fundo)}
.topo{position:absolute;inset:0 0 auto;height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 90px;
  border-bottom:1px solid var(--linha)}
.marca{display:flex;gap:22px;align-items:center}
.selo{width:58px;height:58px;border-radius:14px;background:var(--ambar);color:var(--fundo);display:grid;place-items:center;
  font:900 26px/1 var(--titulo);font-stretch:110%}
.marca b{font:800 30px/1.1 var(--titulo);font-stretch:112%;letter-spacing:.01em}
.marca span{display:block;font-size:17px;color:var(--suave);margin-top:4px}
.data{font-size:21px;color:var(--suave)}
.data b{color:var(--tinta);font-weight:600}
.slide{position:absolute;inset:110px 0 120px;display:grid;grid-template-columns:780px 1fr;gap:70px;padding:70px 90px 40px;
  align-items:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
.slide.ativo{opacity:1;visibility:visible;transition:opacity .6s}
.area{font:700 22px var(--texto);letter-spacing:.16em;text-transform:uppercase;color:var(--ambar);margin:0 0 26px}
.slide h2{font:800 64px/1.06 var(--titulo);font-stretch:108%;margin:0 0 30px;text-wrap:balance}
.grande{font:900 160px/.95 var(--titulo);font-stretch:118%;color:var(--tinta);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.apoio{font-size:30px;line-height:1.4;color:var(--suave);margin:24px 0 0;max-width:32ch}
.apoio b{color:var(--tinta);font-weight:600}
.lado{display:flex;gap:36px;margin-top:34px}
.mini{border-left:4px solid var(--ceu);padding:4px 0 4px 20px}
.mini strong{display:block;font:800 50px/1.05 var(--titulo);font-stretch:110%;font-variant-numeric:tabular-nums}
.mini span{font-size:21px;color:var(--suave)}
.grafico{height:640px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.grafico.centro{align-items:center}
.grafico h3{font:600 24px var(--texto);color:var(--suave);margin:0 0 18px;align-self:stretch}
.legenda{display:flex;gap:28px;font-size:22px;color:var(--suave);margin:-6px 0 14px}
.legenda i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:10px;vertical-align:-2px}
svg{display:block;width:100%;height:auto;overflow:visible}
.eixo{fill:var(--suave);font:500 22px var(--texto)}
.rotulo{fill:var(--tinta);font:700 22px var(--texto);opacity:0}
.grade{stroke:var(--linha);stroke-width:1.5}
.barra{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.ativo .barra{transform:scaleY(1);transition:transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.ativo .rotulo{opacity:1;transition:opacity .5s calc(var(--d,0s) + .7s)}
.traco{stroke-dasharray:1;stroke-dashoffset:1}
.ativo .traco{stroke-dashoffset:0;transition:stroke-dashoffset 2.2s ease-in-out .3s}
.ponto{opacity:0}.ativo .ponto{opacity:1;transition:opacity .3s var(--d)}
.anel .val{stroke-dasharray:100;stroke-dashoffset:100}
.ativo .anel .val{stroke-dashoffset:calc(100 - var(--p));transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1) .3s}
.hbar{display:grid;grid-template-columns:360px 1fr 150px;align-items:center;gap:20px;margin:16px 0;font-size:27px}
.hbar .trilho{height:44px;background:var(--painel);border-radius:8px;overflow:hidden}
.hbar .enche{height:100%;width:var(--w);background:var(--ceu);border-radius:8px;transform:scaleX(0);transform-origin:left}
.ativo .hbar .enche{transform:scaleX(1);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) var(--d)}
.hbar b{font:800 30px var(--titulo);text-align:right;font-variant-numeric:tabular-nums}
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:12px;width:540px}
.waffle i{aspect-ratio:1;border-radius:8px;background:var(--painel)}
.ativo .waffle i.on{background:var(--bom);transition:background .25s var(--d)}
.waffle-leg{font-size:24px;color:var(--suave);margin-top:20px}
.abertura{grid-template-columns:1fr}
.abertura h2{font-size:150px;line-height:.95;font-stretch:120%;margin:0}
.abertura h2 em{font-style:normal;color:var(--ambar)}
.temas{display:flex;flex-wrap:wrap;gap:16px;margin-top:50px}
.temas span{font-size:26px;padding:12px 24px;border:1px solid var(--linha);border-radius:999px;color:var(--suave)}
.rodape{position:absolute;inset:auto 0 0;height:120px;padding:0 90px;display:flex;align-items:center;justify-content:space-between;
  gap:40px;border-top:1px solid var(--linha);font-size:21px;color:var(--suave)}
.pontos{display:flex;gap:10px}
.pontos button{width:52px;height:8px;border:0;padding:0;border-radius:4px;background:var(--linha);overflow:hidden;cursor:pointer}
.pontos button span{display:block;height:100%;width:100%;background:var(--ambar);transform:scaleX(0);transform-origin:left}
.pontos button.feito span{transform:scaleX(1)}
.pontos button.agora span{animation:progresso var(--dur) linear forwards}
.pausado .pontos button.agora span{animation-play-state:paused}
.pontos button:focus-visible{outline:3px solid var(--ceu);outline-offset:4px}
@keyframes progresso{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .slide,.slide.ativo,.ativo .barra,.ativo .rotulo,.ativo .traco,.ativo .ponto,.ativo .anel .val,.ativo .hbar .enche,
  .ativo .waffle i.on{transition:none!important}
  .pontos button.agora span{animation:none;transform:scaleX(1)}
}
</style>
</head>

  const t = h("h2"); t.append("Como o Conselho", document.createElement("br"), "atende "); t.appendChild(h("em", "", "você")); d.appendChild(t);
  const tm = h("div", "temas"); [...new Set(DADOS.telas.map(x => x.area))].forEach(a => tm.appendChild(h("span", "", a))); d.appendChild(tm);
  ab.appendChild(d); raiz.appendChild(ab);
  DADOS.telas.forEach(x => raiz.appendChild(montar(x)));

  // Carrossel
  const palco = document.getElementById("palco"), slides = [...raiz.children], nav = document.getElementById("pontos");
  const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches, DUR = 12000;
  let atual = 0, timer = null, pausado = false, restante = DUR, inicio = 0;
  slides.forEach((s, i) => { const b = document.createElement("button"); b.setAttribute("aria-label", `Tela ${i + 1}: ${s.getAttribute("aria-label")}`); b.innerHTML = "<span></span>"; b.addEventListener("click", () => ir(i)); nav.appendChild(b); });

  function contar(s) {
    s.querySelectorAll("[data-alvo]").forEach(e => {
      const alvo = +e.dataset.alvo, casas = +e.dataset.casas, suf = e.dataset.sufixo, fim = e.dataset.final;
      if (reduzir) { e.textContent = fim; return; }
      const t0 = performance.now(), dur = 1600;
      const passo = tt => {
        const k = Math.min((tt - t0) / dur, 1), v = alvo * (1 - Math.pow(1 - k, 3));
        e.textContent = k < 1 ? v.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }) + suf : fim;
        if (k < 1 && s.classList.contains("ativo")) requestAnimationFrame(passo); else e.textContent = fim;
      };
      requestAnimationFrame(passo);
    });
  }
  function agendar(ms) { clearTimeout(timer); inicio = performance.now(); restante = ms; timer = setTimeout(() => ir(atual + 1), ms); }
  function ir(i) {
    atual = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("ativo", k === atual));
    [...nav.children].forEach((b, k) => { b.className = k < atual ? "feito" : ""; });
    const b = nav.children[atual]; void b.offsetWidth; b.className = "agora";
    contar(slides[atual]);
    if (!pausado) agendar(DUR);
  }
  function alternarPausa() {
    pausado = !pausado; palco.classList.toggle("pausado", pausado);
    if (pausado) { clearTimeout(timer); restante -= performance.now() - inicio; } else agendar(Math.max(restante, 500));
  }
  addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); alternarPausa(); }
    else if (e.key === "ArrowRight") ir(atual + 1);
    else if (e.key === "ArrowLeft") ir(atual - 1);
  });
  const escalar = () => palco.style.setProperty("--s", Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener("resize", escalar); escalar();
  const m = /^#tela-(\d+)$/.exec(location.hash);  // painel_publico.html#tela-4 abre na 4ª tela
  ir(m ? +m[1] - 1 : 0);
})();
</script>
